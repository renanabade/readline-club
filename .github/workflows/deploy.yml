# Deploy de produção pelo GitHub: o merge na main publica sozinho, sem máquina local.
#
# Ordem de docs/operacao.md: com migration pendente, anota o ponto de restauração do Time Travel
# do D1 e aplica as migrations; depois publica o mailer e o Pages. O secret do mailer
# (ADMIN_NOTIFY_EMAIL) e os do Pages já estão na Cloudflare e continuam lá a cada deploy.
# Fica desligado até a variável DEPLOY_ENABLED=true. Secrets no environment "production":
# CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. PRs de fork nunca chegam aqui: o workflow só roda
# depois do Verify de um push na main, e o environment só aceita a main.
name: Deploy

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez e nenhum cancelado no meio: uma migration pela metade é pior que esperar.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Um Verify antigo terminando depois de um merge novo não publica código velho por cima.
      - name: Só a ponta da main
        id: tip
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Este commit já não é a ponta da main; o deploy do commit mais novo publica." >> "$GITHUB_STEP_SUMMARY"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.tip.outputs.stale != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.tip.outputs.stale != 'true'
        run: npm ci

      - name: Migrations pendentes
        id: pending
        if: steps.tip.outputs.stale != 'true'
        run: |
          list=$(npx wrangler d1 migrations list DB --remote)
          pending=$(printf '%s\n' "$list" | grep -oE '[0-9]{4}_[A-Za-z0-9_-]+\.sql' | tr '\n' ' ' || true)
          echo "files=$pending" >> "$GITHUB_OUTPUT"
          echo "Migrations pendentes: ${pending:-nenhuma}" >> "$GITHUB_STEP_SUMMARY"

      # Ponto de restauração do D1 antes de mexer no schema (vale 30 dias). O log não traz dados.
      - name: Marca do Time Travel
        if: steps.tip.outputs.stale != 'true' && steps.pending.outputs.files != ''
        run: |
          npx wrangler d1 time-travel info clube-do-livro-db | tee timetravel.txt
          echo "Time Travel antes da migration: \`$(grep -oE "bookmark is '[^']+'" timetravel.txt)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Aplica as migrations
        if: steps.tip.outputs.stale != 'true' && steps.pending.outputs.files != ''
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build
        if: steps.tip.outputs.stale != 'true'
        run: npm run build

      - name: Publica o mailer
        if: steps.tip.outputs.stale != 'true'
        run: npx wrangler deploy --config wrangler.mailer.jsonc

      - name: Publica o Pages
        if: steps.tip.outputs.stale != 'true'
        run: npx wrangler pages deploy dist --project-name readlineclub --branch main --commit-hash "${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Conferência em produção
        if: steps.tip.outputs.stale != 'true'
        run: |
          entry=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -1)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://readline.club/?deploy=${{ github.run_id }}" | grep -q "$entry"; then
              echo "Publicado: $entry" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "O HTML em produção não traz $entry" && exit 1
