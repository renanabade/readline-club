name: External pull requests
# The repository is public for transparency and does not accept external
# contributions. This job never checks out or runs code from the pull request.
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR_URL" --comment "Obrigado pelo interesse! Este repositório é público por transparência e não aceita contribuições externas. Se encontrou um bug, abra uma issue pelo template; se for uma falha de segurança, siga o SECURITY.md."
